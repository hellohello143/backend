name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Set up Rust and NSIS
        shell: pwsh
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt
          rustup override set 1.100.0
          if (!(Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis --yes --no-progress
          }
      - name: Format, test and build
        shell: pwsh
        run: |
          cargo fmt --check
          cargo test --locked
          cargo build --release --locked
      - name: Compile and test the package
        shell: pwsh
        run: |
          python packaging/package.py --exe target/release/kuma-capture.exe --nsis "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\dist\stage\KumaCapture.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: KumaCapture-Windows-x64
          path: |
            dist/KumaCaptureSetup.exe
            dist/KumaCapture-Windows-x64.zip
            dist/SHA256SUMS.txt
            docs/TESTER.md

  prerelease:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: windows
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: KumaCapture-Windows-x64
          path: package
      - name: Publish Windows test build
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$REPOSITORY" --prerelease --verify-tag --title "Kuma Capture $TAG" --notes "Windows tester build. Follow the attached checklist."
          find package -type f -print0 | xargs -0 gh release upload "$TAG" --repo "$REPOSITORY"
